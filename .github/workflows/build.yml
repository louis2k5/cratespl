name: Build Minecraft Plugin (Paper 1.26.3)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Plugin mit Maven bauen
        run: |
          POM_FILE=$(find . -name "pom.xml" -print -quit)
          echo "Gefundene pom.xml: $POM_FILE"
          mvn clean package --batch-mode -f "$POM_FILE"

      - name: Fertige JAR-Datei als Artifact bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Crates-Plugin-1.26.3
          path: "**/target/*.jar"
